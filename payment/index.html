<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>春喃日光 Whispring Inn｜付款提醒</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#faf8f4;color:#333;padding:20px;max-width:540px;margin:0 auto}
    .header{text-align:center;padding:24px 0 16px;border-bottom:1px solid #e8e0d5;margin-bottom:20px}
    .logo{font-size:1.4em;font-weight:bold;color:#7a6152}
    .sub{color:#aaa;font-size:.85em;margin-top:4px}
    .welcome{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06);line-height:1.8;font-size:.95em}
    .welcome p{margin-bottom:10px}
    .welcome p:last-child{margin-bottom:0}
    .card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    h2{font-size:1em;color:#7a6152;margin-bottom:14px}
    .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ebe5;font-size:.95em}
    .info-row:last-child{border-bottom:none}
    .info-row .k{color:#888}
    .info-row .v{font-weight:600}
    .account{font-size:1.5em;font-weight:700;color:#7a6152;letter-spacing:2px;text-align:center;padding:14px;background:#faf0e8;border-radius:10px;margin:14px 0}
    .copy-btn{width:100%;background:#7a6152;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.95em;cursor:pointer}
    .copy-btn:active{background:#5a4a3a}
    .note{background:#fff8f0;border-left:3px solid #e8a87c;padding:12px 14px;border-radius:0 8px 8px 0;font-size:.88em;color:#666;margin:14px 0;line-height:1.7}
    .line-id{background:#07b53b;color:#fff;border-radius:8px;padding:4px 10px;font-size:.85em;font-weight:600;display:inline-block;margin-top:6px}
    .highlight{font-weight:700;color:#c0392b}
    .footer{text-align:center;color:#ccc;font-size:.78em;margin-top:28px;padding-bottom:24px;line-height:1.8}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">春喃日光</div>
    <div class="sub">Whispring Inn｜付款提醒</div>
  </div>

  <div class="welcome">
    <p>歡迎您今日到訪！請注意：</p>
    <p><span class="highlight">台灣 Booking.com 目前不支援線上直接扣款！</span></p>
    <p>房費請您「務必於入住前」，主動以「轉帳」的方式直接轉入以下收款帳號：</p>
  </div>

  <div class="card">
    <h2>💳 匯款資訊</h2>
    <div class="info-row"><span class="k">銀行</span><span class="v">台新銀行（812）</span></div>
    <div class="info-row"><span class="k">戶名</span><span class="v">楊伯彥</span></div>
    <div class="info-row"><span class="k">帳號</span><span class="v">28881004517240</span></div>
    <div class="account">28881004517240</div>
    <button class="copy-btn" onclick="copyAcc()">複製帳號</button>
  </div>

  <div class="note">
    請根據您訂單上的金額匯款，完成後再麻煩回覆告知我們哦～<br>
    「待確認收到款項後」，即會發送「入住指引」協助您自助入住！
  </div>

  <div class="note">
    有任何疑問歡迎透過平台或加入我們官方 LINE 詢問：<br>
    <span class="line-id">＠whispring.inn</span>
  </div>

  <div class="footer">
    春喃日光 Whispring Inn<br>
    感謝您選擇春喃日光，期待您的到來！
  </div>

  <script>
    function copyAcc(){
      navigator.clipboard.writeText('28881004517240').then(function(){
        var b = document.querySelector('.copy-btn');
        b.textContent = '✅ 已複製！';
        setTimeout(function(){ b.textContent = '複製帳號'; }, 2000);
      });
    }
  </script>
</body>
</html>
